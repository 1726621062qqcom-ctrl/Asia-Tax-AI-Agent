services:
  - type: web
    name: taxrora
    runtime: python
    plan: free
    region: singapore
    branch: deploy/taxrora-current-ui
    buildCommand: bash scripts/render_build.sh
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.16
      - key: FSIE_AUTH_SECURE_COOKIE
        value: "true"
      - key: FSIE_WEB_SECURE_COOKIE
        value: "true"
      - key: FSIE_AUTH_SITE_URL
        value: https://taxrora.onrender.com
      - key: FSIE_AUTH_SUPABASE_URL
        sync: false
      - key: FSIE_AUTH_PUBLISHABLE_KEY
        sync: false
      - key: FSIE_DATABASE_URL
        sync: false
